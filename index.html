<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Список задач</title>
  <meta name="description" content="Простой список задач: добавить, отметить, удалить. Всё хранится в браузере.">
  <meta name="theme-color" content="#f4f5f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16181a" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main class="page">
    <header class="head">
      <h1>Задачи</h1>
      <p class="today" id="today"></p>
    </header>

    <form class="add" id="add-form" autocomplete="off">
      <label class="visually-hidden" for="new-todo">Новая задача</label>
      <input id="new-todo" name="title" type="text" maxlength="200"
             placeholder="Что нужно сделать?" enterkeyhint="done" required>
      <button type="submit">Добавить</button>
    </form>

    <section class="board" id="board" hidden>
      <div class="toolbar">
        <div class="filters" role="group" aria-label="Показать">
          <button type="button" data-filter="all" aria-pressed="true">Все <span data-count="all"></span></button>
          <button type="button" data-filter="active" aria-pressed="false">Активные <span data-count="active"></span></button>
          <button type="button" data-filter="done" aria-pressed="false">Готово <span data-count="done"></span></button>
        </div>
        <p class="left" id="left" aria-live="polite"></p>
      </div>

      <ul class="list" id="list"></ul>
      <p class="list-empty" id="list-empty" hidden></p>

      <div class="board-foot">
        <button type="button" class="link-btn" id="clear-done">Убрать выполненные</button>
      </div>
    </section>

    <p class="empty" id="empty" hidden>Список пуст. Запишите первое дело, а остальное подтянется.</p>
    <p class="warning" id="storage-warning" hidden>
      Браузер не даёт сохранить задачи. После обновления страницы список пропадёт.
    </p>
  </main>

  <div class="toast" id="toast" role="status" hidden>
    <span id="toast-text"></span>
    <button type="button" class="link-btn" id="toast-undo">Вернуть</button>
  </div>

  <template id="todo-template">
    <li class="todo">
      <input class="todo-check" type="checkbox">
      <span class="todo-title"></span>
      <button type="button" class="icon-btn todo-edit">
        <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true">
          <path d="M12.5 4.5l3 3L8 15H5v-3l7.5-7.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        </svg>
      </button>
      <button type="button" class="icon-btn todo-delete">
        <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true">
          <path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
    </li>
  </template>

  <noscript><p class="empty">Для работы списка нужен включённый JavaScript.</p></noscript>
</body>
</html>
